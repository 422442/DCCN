<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab File Cover Generator</title>
<style>
:root{color-scheme:only light;--bg:#f1f4fa;--ink:#2d3340;--hi:#fff;--lo:#c9d1e3;--accent:#d6e0ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f1f4fa;color-scheme:only light}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(12px,4vw,32px)}
.card{width:100%;max-width:460px;background:var(--bg);border-radius:36px;padding:clamp(20px,6vw,34px);
box-shadow:14px 14px 28px var(--lo),-14px -14px 28px var(--hi),inset 4px 4px 10px rgba(255,255,255,.7),inset -4px -4px 10px rgba(185,194,214,.45)}
.head{text-align:center;margin-bottom:22px}
.logo{width:clamp(90px,28vw,120px);height:clamp(90px,28vw,120px);border-radius:50%;display:block;margin:0 auto 14px;background:#fff;padding:4px;
box-shadow:8px 8px 16px var(--lo),-8px -8px 16px var(--hi)}
h1{font-size:clamp(15px,4.6vw,19px);margin:0 0 4px;letter-spacing:.3px;text-transform:uppercase;color:#000}
.head p{margin:0;font-size:clamp(13px,3.8vw,15px);font-weight:600;color:#000}
label{display:block;font-size:13px;font-weight:600;margin:14px 6px 6px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:0;border-radius:20px;padding:14px 18px;outline:0;
box-shadow:inset 6px 6px 12px var(--lo),inset -6px -6px 12px var(--hi);appearance:none;-webkit-appearance:none}
input:focus,select:focus{box-shadow:inset 6px 6px 12px var(--lo),inset -6px -6px 12px var(--hi),0 0 0 3px #aebfff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:380px){.row{grid-template-columns:1fr}}
button{width:100%;margin-top:26px;font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:var(--accent);border:0;border-radius:24px;padding:16px;cursor:pointer;
box-shadow:8px 8px 16px var(--lo),-8px -8px 16px var(--hi),inset 3px 3px 6px rgba(255,255,255,.7),inset -3px -3px 6px rgba(120,140,200,.35);transition:.15s}
button:active{box-shadow:inset 6px 6px 12px rgba(120,140,200,.45),inset -6px -6px 12px rgba(255,255,255,.7);transform:scale(.99)}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;text-align:center;font-size:13px;margin-top:12px;color:#a33}
#done{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:10;gap:clamp(10px,2.5vh,22px)}
#done.on{display:flex}
#done img{width:min(86vw,48vh,380px);height:auto;filter:drop-shadow(8px 8px 14px var(--lo)) drop-shadow(-6px -6px 12px var(--hi))}
#done h2{margin:0;font-size:clamp(34px,10vw,64px);letter-spacing:1px}
#done p{margin:0;max-width:30em;font-size:clamp(14px,4vw,18px);line-height:1.5}
#done button{width:auto;margin:0;padding:12px 28px;font-size:15px}
</style>
</head>

function clean(t){return t.replace(/[^\x20-\x7E\xA0-\xFF]/g,"?").trim();}

async function grayLogo(){
  return Uint8Array.from(atob(LOGO.split(",")[1]),c=>c.charCodeAt(0));
}

async function build(v){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const res=await fetch(PDF_URL);
  if(!res.ok)throw new Error("practical.pdf not found next to index.html");
  const doc=await PDFDocument.load(await res.arrayBuffer());
  const pg=doc.insertPage(0,[595.28,841.89]);
  const W=595.28,H=841.89,cx=W/2;
  const reg=await doc.embedFont(StandardFonts.Helvetica);
  const bold=await doc.embedFont(StandardFonts.HelveticaBold);
  const k=rgb(0,0,0);
  pg.drawRectangle({x:30,y:30,width:W-60,height:H-60,borderColor:k,borderWidth:1.2});
  const logo=await doc.embedJpg(await grayLogo());
  const L=140;pg.drawImage(logo,{x:cx-L/2,y:H-60-L,width:L,height:L});
  const center=(t,y,f,s)=>{t=clean(t);while(f.widthOfTextAtSize(t,s)>W-110&&s>7)s-=.5;pg.drawText(t,{x:cx-f.widthOfTextAtSize(t,s)/2,y,size:s,font:f,color:k});};
  center("LAMRIN TECH SKILLS UNIVERSITY, PUNJAB",H-60-L-34,bold,19);
  center("University School of Engineering & Technology",H-60-L-58,bold,13);
  pg.drawLine({start:{x:90,y:H-60-L-84},end:{x:W-90,y:H-60-L-84},thickness:.8,color:k});
  center("Data Communication and Computer Networks Lab",H-60-L-135,bold,20);
  center("PRACTICAL FILE",H-60-L-165,reg,15);
  const rows=[["Name",v.name],["Roll No",v.roll],["Branch",v.branch],["Semester",v.sem],["Submitted to",v.to]];
  let y=330;
  for(const [a,b] of rows){
    pg.drawText(a+":",{x:110,y,size:13,font:bold,color:k});
    let t=clean(b),s=13;const mw=W-110-215;
    while(reg.widthOfTextAtSize(t,s)>mw&&s>7)s-=.5;
    pg.drawText(t,{x:215,y,size:s,font:reg,color:k});
    y-=42;
  }
  return doc.save();
}

$("f").addEventListener("submit",async e=>{
  e.preventDefault();$("msg").textContent="";
  const v={name:$("name").value,roll:$("roll").value,branch:$("branch").value,sem:$("sem").value,to:$("to").value};
  const btn=$("go");btn.disabled=true;btn.textContent="Generating...";
  try{
    const bytes=await build(v);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    a.download=(clean(v.name+"_"+v.roll).replace(/[^\w-]+/g,"_")||"Lab")+"_Networks_Lab_File.pdf";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    $("done").classList.add("on");
  }catch(err){
    $("msg").textContent=location.protocol==="file:"?"Open this page through GitHub Pages (or a local server), not as a local file.":err.message;
  }
  btn.disabled=false;btn.textContent="Generate PDF";
});
$("back").onclick=()=>$("done").classList.remove("on");
</script>
